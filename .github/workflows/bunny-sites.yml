name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:

# Production deploys serialize across every ref; cancelling mid-upload would leave a half-written deploy directory behind.
concurrency:
  group: bunny-sites
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write # records the deploy in the repo's Environments
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: BunnyWay/actions/deploy-site@deploy-site_0.1.0
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        with:
          site: "my-simple-site"
          directory: "dist"
          api_key: ${{ secrets.BUNNY_API_KEY }}
